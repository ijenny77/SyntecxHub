<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayfarer — A Photography Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <div class="wrap">

        <header>
            <div class="titleblock">
                <span class="kicker">Now showing</span>
                <h1>Wayfarer</h1>
                <p>Twelve favorite shots from the field - bright mornings, busy streets, and quiet corners worth a second look.</p>
            </div>
            <div class="meta">
                <div><strong>12</strong> photos</div>
                <div>2021 - 2026</div>
            </div>
        </header>

        <nav class="filters" id="filters">
            <button data-filter="all" class="active">All photos</button>
            <button data-filter="landscape">Landscape</button>
            <button data-filter="structure">Structure</button>
            <button data-filter="street">Street</button>
            <button data-filter="still">Still life</button>
        </nav>

        <section class="grid" id="grid"></section>

        <footer>
            <span>Hover a photo to see its story</span>
            <span>Sorted the way I like to at them</span>
        </footer>

    </div>

    <script src="gallery.js"></script>
</body>
</html>
