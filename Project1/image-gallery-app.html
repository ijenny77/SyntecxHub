<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayfarer — A Photography Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fff6ec;
    --bg-dot: #ffe8d1;
    --card: #ffffff;
    --ink: #3a2e2b;
    --ink-soft: #8a7267;
    --coral: #ff6f5e;
    --coral-deep: #f0503d;
    --teal: #16b8a6;
    --sun: #ffc857;
    --shadow: rgba(255, 111, 94, .18);
    --line: rgba(58,46,43,.1);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    background-image:
      radial-gradient(circle at 1px 1px, var(--bg-dot) 1.5px, transparent 0);
    background-size:24px 24px;
    min-height:100vh;
  }

  .wrap{
    max-width:1280px;
    margin:0 auto;
    padding:64px 32px 96px;
  }

  header{
    margin-bottom:48px;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
  }

  .titleblock .kicker{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:0.78rem;
    color:var(--coral-deep);
    background:#fff0e9;
    padding:6px 14px;
    border-radius:100px;
    margin-bottom:16px;
  }

  .titleblock .kicker::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--sun);
    display:inline-block;
  }

  .titleblock h1{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:clamp(2.4rem, 5vw, 3.8rem);
    line-height:1.05;
    margin:0 0 12px;
    letter-spacing:-0.01em;
    color:var(--ink);
  }

  .titleblock p{
    max-width:48ch;
    margin:0;
    color:var(--ink-soft);
    font-size:1.02rem;
    line-height:1.6;
  }

  .meta{
    font-size:0.85rem;
    color:var(--ink-soft);
    text-align:right;
    line-height:1.8;
    white-space:nowrap;
  }

  .meta strong{
    color:var(--coral-deep);
    font-weight:700;
    font-size:1.15rem;
    font-family:'Poppins', sans-serif;
  }

  nav.filters{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:44px;
  }

  nav.filters button{
    font-family:'Poppins', sans-serif;
    background:var(--card);
    border:2px solid transparent;
    font-size:0.88rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    padding:9px 20px;
    border-radius:100px;
    transition:all .22s ease;
    box-shadow:0 2px 8px var(--shadow);
  }

  nav.filters button:hover{
    color:var(--coral-deep);
    transform:translateY(-1px);
  }

  nav.filters button.active{
    color:#fff;
    background:linear-gradient(135deg, var(--coral), var(--coral-deep));
    box-shadow:0 6px 16px var(--shadow);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:32px 26px;
  }

  figure{
    margin:0;
    background:var(--card);
    padding:0;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 6px 20px -6px rgba(58,46,43,.12);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    opacity:0;
    transform:translateY(14px);
    animation:rise .6s ease forwards;
  }

  @keyframes rise{
    to{opacity:1; transform:translateY(0);}
  }

  figure:hover{
    transform:translateY(-8px) rotate(-0.3deg);
    box-shadow:0 20px 34px -10px var(--shadow);
  }

  .frame{
    position:relative;
    overflow:hidden;
    aspect-ratio:4/5;
    background:var(--bg-dot);
  }

  .frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.03);
    transition:transform .6s cubic-bezier(.2,.8,.2,1);
  }

  figure:hover .frame img{
    transform:scale(1.12);
  }

  .plate{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:18px 18px 16px;
    background:linear-gradient(to top, rgba(58,26,20,.88) 0%, rgba(58,26,20,.4) 65%, transparent 100%);
    color:#fff8f0;
    transform:translateY(100%);
    transition:transform .38s cubic-bezier(.2,.8,.2,1);
  }

  figure:hover .plate,
  figure:focus-within .plate{
    transform:translateY(0);
  }

  .plate .num{
    display:inline-block;
    font-family:'Poppins', sans-serif;
    font-size:0.7rem;
    letter-spacing:0.04em;
    color:#3a2e2b;
    background:var(--sun);
    padding:2px 9px;
    border-radius:100px;
    margin-bottom:8px;
    font-weight:700;
  }

  .plate h3{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size:1.1rem;
    margin:0 0 3px;
    line-height:1.25;
  }

  .plate p{
    margin:0;
    font-size:0.82rem;
    color:#ffe3d6;
  }

  figcaption.label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:14px 18px 16px;
    font-size:0.85rem;
    color:var(--ink-soft);
  }

  figcaption.label .name{
    color:var(--ink);
    font-weight:700;
    font-family:'Poppins', sans-serif;
    font-size:0.92rem;
  }

  .empty{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:0.95rem;
  }

  footer{
    margin-top:64px;
    padding-top:24px;
    border-top:2px dashed var(--line);
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    font-size:0.82rem;
    color:var(--ink-soft);
    font-weight:600;
  }

  @media (max-width:560px){
    .wrap{padding:40px 18px 64px;}
    header{align-items:flex-start;}
    .meta{text-align:left;}
    .grid{grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:24px 18px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="titleblock">
      <span class="kicker">Now showing</span>
      <h1>Wayfarer</h1>
      <p>Twelve favorite shots from the field — bright mornings, busy streets, and quiet corners worth a second look.</p>
    </div>
    <div class="meta">
      <div><strong>12</strong> photos</div>
      <div>2021 – 2026</div>
    </div>
  </header>

  <nav class="filters" id="filters">
    <button data-filter="all" class="active">All photos</button>
    <button data-filter="landscape">Landscape</button>
    <button data-filter="structure">Structure</button>
    <button data-filter="street">Street</button>
    <button data-filter="still">Still life</button>
  </nav>

  <section class="grid" id="grid"></section>

  <footer>
    <span>✨ Hover a photo to see its story</span>
    <span>Sorted the way I like to look at them</span>
  </footer>

</div>

<script>
  const works = [
    { id: 1015, cat: "landscape", title: "Valley Before Rain", medium: "Digital print", year: "2023" },
    { id: 1002, cat: "structure", title: "Concrete Interval", medium: "Silver gelatin", year: "2022" },
    { id: 1025, cat: "still",     title: "Fox, Unbothered", medium: "Digital print", year: "2024" },
    { id: 1041, cat: "street",    title: "Corner, Late August", medium: "Digital print", year: "2021" },
    { id: 1053, cat: "landscape", title: "Coastal Interruption", medium: "Silver gelatin", year: "2025" },
    { id: 1062, cat: "structure", title: "Stair Study No. 4", medium: "Digital print", year: "2023" },
    { id: 1074, cat: "still",     title: "Bread and Table", medium: "Digital print", year: "2024" },
    { id: 1084, cat: "street",    title: "Market, Half Empty", medium: "Silver gelatin", year: "2022" },
    { id: 1076, cat: "landscape", title: "Ridge Line at Dusk", medium: "Digital print", year: "2026" },
    { id: 1069, cat: "structure", title: "Glass Over Water", medium: "Digital print", year: "2023" },
    { id: 1080, cat: "still",     title: "Two Chairs, One Light", medium: "Silver gelatin", year: "2021" },
    { id: 1050, cat: "street",    title: "Waiting Room", medium: "Digital print", year: "2025" },
  ];

  const grid = document.getElementById('grid');
  const filters = document.getElementById('filters');

  function pad(n){ return String(n).padStart(2, '0'); }

  function render(list){
    grid.innerHTML = '';
    if(!list.length){
      grid.innerHTML = '<div class="empty">No photos in this category yet.</div>';
      return;
    }
    list.forEach((w, i) => {
      const fig = document.createElement('figure');
      fig.style.animationDelay = (i * 45) + 'ms';
      fig.tabIndex = 0;
      fig.innerHTML = `
        <div class="frame">
          <img src="https://picsum.photos/id/${w.id}/700/875" alt="${w.title}" loading="lazy">
          <div class="plate">
            <div class="num">No. ${pad(i+1)}</div>
            <h3>${w.title}</h3>
            <p>${w.medium}, ${w.year}</p>
          </div>
        </div>
        <figcaption class="label">
          <span class="name">${w.title}</span>
          <span>${w.year}</span>
        </figcaption>
      `;
      grid.appendChild(fig);
    });
  }

  filters.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    filters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const f = btn.dataset.filter;
    render(f === 'all' ? works : works.filter(w => w.cat === f));
  });

  render(works);
</script>

</body>
</html>
